name: Build and publish Docker image

# Builds on GitHub's runners and pushes to GHCR, so small deployment targets
# (e.g. a 1GB droplet) never need to run `docker build` themselves -- that
# needs well over 1GB of RAM for `npm ci` + `next build` and will OOM a box
# that size. Deploy by pulling the published image instead (see README).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # DEPLOY_SSH_KEY authenticates as a dedicated key that the droplet
      # restricts (via a `command=` forced-command in authorized_keys) to
      # only ever run /root/deploy.sh, regardless of what's requested here --
      # so this step can't do anything beyond that one script even if this
      # secret were ever exposed.
      - name: Pull and restart on the droplet
        uses: appleboy/ssh-action@v1
        with:
          host: 137.184.119.101
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: /root/deploy.sh
