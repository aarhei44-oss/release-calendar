<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Release Watcher — temporarily unavailable</title>
<style>
  :root {
    color-scheme: light dark;
    --background: #ffffff;
    --foreground: #171717;
    --muted: #6b7280;
    --border: #e5e7eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --background: #0a0a0a;
      --foreground: #ededed;
      --muted: #9ca3af;
      --border: #27272a;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--background);
    color: var(--foreground);
    font-family: Arial, Helvetica, sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  main {
    max-width: 28rem;
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  h1 {
    font-size: 1.25rem;
    font-weight: 600;
    margin: 0;
  }
  p {
    margin: 0;
    color: var(--muted);
    font-size: 0.95rem;
    line-height: 1.5;
  }
  .brand {
    font-weight: 600;
    margin-bottom: 8px;
  }
</style>
</head>
<body>
  <main>
    <div class="brand">Release Watcher</div>
    <h1>We&rsquo;ll be right back.</h1>
    <p>Release Watcher is temporarily unavailable while we sort out a hiccup on our end. Nothing you&rsquo;ve tracked or subscribed to has been lost — try again in a few minutes.</p>
  </main>
</body>
</html>
